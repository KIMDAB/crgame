# Production deployment on a cloud VM SHARED with other projects.
#
# DB (Supabase Postgres) and Redis (Aiven Valkey) are managed services accessed
# via the `prod` Spring profile, so no postgres/redis containers run here.
#
# IMPORTANT: this stack does NOT bind host ports 80/443. The cnr nginx (which
# carries the SSE-specific tuning) is published only on 127.0.0.1:${CNR_HTTP_PORT}
# so it cannot collide with other projects. A shared front reverse proxy on the
# host (see docker/README-deploy.md) terminates 80/443 and routes the cnr domain
# to that local port.
#
# Everything runs on the dedicated `cnr-net` network to stay isolated from other
# compose projects on the same host.
#
# Usage on the VM (from the docker/ directory):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env vars must live in docker/.env (see .env.example).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cnr-app
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JAVA_OPTS: "${JAVA_OPTS:--Xmx512m -Xms256m}"
      RDS_POSTGRES_USERNAME: ${RDS_POSTGRES_USERNAME}
      RDS_POSTGRES_PASSWORD: ${RDS_POSTGRES_PASSWORD}
      CACHE_VALKEY_PASSWORD: ${CACHE_VALKEY_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
    networks:
      - cnr-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cnr-nginx
    # Published on a public host port (default 8081) so cnr is reachable directly
    # at http://<vm-ip>:${CNR_HTTP_PORT} alongside the existing app on :8000.
    # Open this port in the EC2 security group inbound rules.
    ports:
      - "${CNR_HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cnr-net
    restart: unless-stopped

networks:
  cnr-net:
    name: cnr-net
